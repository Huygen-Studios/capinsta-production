x-backend-image: &backend-image
  image: ghcr.io/huygen-studios/capinsta-production-backend:${CAPINSTA_IMAGE_TAG:?Set CAPINSTA_IMAGE_TAG}
  restart: unless-stopped
  init: true
  stop_grace_period: 45s
  volumes:
    - clipper-workspaces:/app/storage
    - model-cache:/data/capinsta/model-cache
  environment: &backend-env
    NODE_ENV: production
    LOG_LEVEL: INFO
    ADMIN_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
    SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY}
    SUPABASE_SOURCE_MEDIA_BUCKET: source-media
    SUPABASE_MEDIA_VARIANTS_BUCKET: media-variants
    SUPABASE_MEDIA_EXPORTS_BUCKET: media-exports
    CLIPPING_STORAGE_PROVIDER: ${CLIPPING_STORAGE_PROVIDER:-r2}
    ENABLE_SUPABASE_MEDIA_STORAGE: ${ENABLE_SUPABASE_MEDIA_STORAGE:-false}
    ENABLE_LOCAL_MEDIA_STORAGE: "false"
    R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?Set R2_ACCOUNT_ID}
    R2_ENDPOINT: ${R2_ENDPOINT:?Set R2_ENDPOINT}
    R2_ENDPOINT_URL: ${R2_ENDPOINT:?Set R2_ENDPOINT}
    R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID}
    R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY}
    R2_REGION: ${R2_REGION:-auto}
    R2_SOURCE_BUCKET: ${R2_SOURCE_BUCKET:-capinsta-source-media}
    R2_VARIANTS_BUCKET: ${R2_VARIANTS_BUCKET:-capinsta-media-variants}
    R2_EXPORTS_BUCKET: ${R2_EXPORTS_BUCKET:-capinsta-media-exports}
    R2_MULTIPART_PART_SIZE_BYTES: ${R2_MULTIPART_PART_SIZE_BYTES:-33554432}
    R2_MULTIPART_CONCURRENCY: ${R2_MULTIPART_CONCURRENCY:-3}
    R2_SIGNED_URL_TTL_SECONDS: ${R2_SIGNED_URL_TTL_SECONDS:-900}
    R2_PRESIGNED_UPLOAD_TTL_SECONDS: ${R2_PRESIGNED_UPLOAD_TTL_SECONDS:-900}
    ENABLE_LOCAL_DEVELOPMENT_ACCESS: "false"
    ENABLE_SUPABASE_DURABLE_JOBS: "true"
    TRUSTED_PROXY_MODE: coolify
    CORS_ORIGINS: ${CORS_ORIGINS:?Set exact CORS_ORIGINS}
    FRONTEND_URL: ${APPLICATION_URL:?Set APPLICATION_URL}
    RENDER_PAGE_URL: http://web:3000/render
    LEGACY_CAPTION_STORAGE_ROOT: /app/storage/legacy-caption
    TEMP_DIR: /app/storage/legacy-caption/tmp
    UPLOAD_DIR: /app/storage/legacy-caption/uploads
    MEDIA_DIR: /app/storage/legacy-caption/media
    EXPORT_DIR: /app/storage/legacy-caption/exports
    CACHE_DIR: /app/storage/legacy-caption/cache
    DB_PATH: /app/storage/legacy-caption/database.sqlite
    CAPINSTA_RENDER_TOKEN_SECRET: ${CAPINSTA_RENDER_TOKEN_SECRET:?Set CAPINSTA_RENDER_TOKEN_SECRET}
    INTERNAL_ADMIN_API_SECRET: ${INTERNAL_ADMIN_API_SECRET:?Set INTERNAL_ADMIN_API_SECRET}
    INTERNAL_MAINTENANCE_SECRET: ${INTERNAL_MAINTENANCE_SECRET:?Set INTERNAL_MAINTENANCE_SECRET}
    UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?Set UPSTASH_REDIS_REST_URL}
    UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?Set UPSTASH_REDIS_REST_TOKEN}
    MAX_SOURCE_FILE_BYTES: ${MAX_SOURCE_FILE_BYTES:-2147483648}
    MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
    DISK_WARNING_FREE_BYTES: ${DISK_WARNING_FREE_BYTES:-1073741824}
    DISK_REJECT_UPLOAD_FREE_BYTES: ${DISK_REJECT_UPLOAD_FREE_BYTES:-268435456}
    DISK_CRITICAL_FREE_BYTES: ${DISK_CRITICAL_FREE_BYTES:-134217728}
    MAX_SOURCE_DURATION_SECONDS: ${MAX_SOURCE_DURATION_SECONDS:-5400}
    MAX_ACTIVE_UPLOADS_PER_USER: ${MAX_ACTIVE_UPLOADS_PER_USER:-2}
    MAX_ACTIVE_PROCESSING_JOBS_PER_USER: ${MAX_ACTIVE_PROCESSING_JOBS_PER_USER:-2}
    MAX_PROCESSING_MINUTES_PER_PERIOD: ${MAX_PROCESSING_MINUTES_PER_PERIOD:-180}
    MAX_STORED_SOURCE_BYTES: ${MAX_STORED_SOURCE_BYTES:-10737418240}
    MAX_STORED_EXPORT_BYTES: ${MAX_STORED_EXPORT_BYTES:-10737418240}
    ENABLE_USAGE_QUOTAS: "true"
    PRIVATE_BETA_MAX_USERS: ${PRIVATE_BETA_MAX_USERS:-10}
    PRIVATE_BETA_ALLOWLIST: ${PRIVATE_BETA_ALLOWLIST:-}
    ENABLE_WHOP_ACCESS: "false"
    DISABLE_NEW_UPLOADS: ${DISABLE_NEW_UPLOADS:-true}
    DISABLE_CANDIDATE_ANALYSIS: ${DISABLE_CANDIDATE_ANALYSIS:-true}
    DISABLE_CLIPPING_EXPORTS: ${DISABLE_CLIPPING_EXPORTS:-true}
    ENABLE_RETENTION_CLEANUP: "true"
    ENABLE_ACCOUNT_DELETION: "true"
    AUTOMATIC_CLIPPER_TEMP_ROOT: /app/storage/automatic-clipper
    AUTOMATIC_CLIPPER_STORAGE_BACKEND: r2
    MEDIA_PROBE_STORAGE_BACKEND: r2
    MEDIA_VARIANT_TEMP_ROOT: /app/storage/media-variants
    MEDIA_VARIANT_STORAGE_BACKEND: r2
    TRANSCRIPTION_TEMP_ROOT: /app/storage/transcription
    TRANSCRIPTION_STORAGE_BACKEND: r2
    TRANSCRIPT_ANALYSIS_STORAGE_BACKEND: r2
    CLIPPING_EXPORT_TEMP_ROOT: /app/storage/exports
    CLIPPING_EXPORT_STORAGE_BACKEND: r2
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    SARVAM_API_KEY: ${SARVAM_API_KEY:-}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-worker: &worker
  <<: *backend-image
  command: python -m server.clipping_jobs.worker
  expose: []
  environment:
    <<: *backend-env
    ENABLE_DURABLE_PROCESSING_WORKER: "true"
    PROCESSING_WORKER_MAX_CONCURRENCY: "1"
    PROCESSING_WORKER_POLL_SECONDS: "2"
  healthcheck:
    test: ["CMD-SHELL", "kill -0 1"]
    interval: 30s
    timeout: 5s
    retries: 3
  cpus: 1.5
  mem_limit: 2g
  pids_limit: 512

services:
  web:
    image: ghcr.io/huygen-studios/capinsta-production-web:${CAPINSTA_IMAGE_TAG:?Set CAPINSTA_IMAGE_TAG}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${APPLICATION_URL:?Set APPLICATION_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY}
      NEXT_PUBLIC_MARBLE_API_URL: ${NEXT_PUBLIC_MARBLE_API_URL:-https://api.marblecms.com}
      NEXT_PUBLIC_CAPINSTA_API_BASE_URL: /api/capinsta
      NEXT_PUBLIC_ENABLE_AI_CAPTIONS: "true"
      NEXT_PUBLIC_ENABLE_CAPINSTA_PROJECT_HANDOFF: "true"
      NEXT_PUBLIC_ENABLE_SERVER_BACKED_EDITOR_MEDIA: "true"
      NEXT_PUBLIC_CAPINSTA_EXPORT_STRATEGY: headless
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?Set UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?Set UPSTASH_REDIS_REST_TOKEN}
      BACKEND_INTERNAL_URL: http://api:10000
      ADMIN_SECURITY_PEPPER: ${ADMIN_SECURITY_PEPPER:?Set ADMIN_SECURITY_PEPPER}
      INTERNAL_ADMIN_API_SECRET: ${INTERNAL_ADMIN_API_SECRET:?Set INTERNAL_ADMIN_API_SECRET}
      INTERNAL_MAINTENANCE_SECRET: ${INTERNAL_MAINTENANCE_SECRET:?Set INTERNAL_MAINTENANCE_SECRET}
      CAPINSTA_RENDER_TOKEN_SECRET: ${CAPINSTA_RENDER_TOKEN_SECRET:?Set CAPINSTA_RENDER_TOKEN_SECRET}
      MARBLE_WORKSPACE_KEY: ${MARBLE_WORKSPACE_KEY:?Set MARBLE_WORKSPACE_KEY}
      TRUSTED_PROXY_MODE: coolify
      ENABLE_CLIPPER_UI: "true"
      ENABLE_WHOP_ACCESS: "false"
      ENABLE_ACCOUNT_DELETION: "true"
      PRIVATE_BETA_MAX_USERS: ${PRIVATE_BETA_MAX_USERS:-10}
      PRIVATE_BETA_ALLOWLIST: ${PRIVATE_BETA_ALLOWLIST:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    <<: *backend-image
    command: uvicorn server.main:app --host 0.0.0.0 --port 10000 --proxy-headers --forwarded-allow-ips=*
    expose:
      - "10000"
    environment:
      <<: *backend-env
      ENABLE_CLIPPING_PROJECT_API: "true"
      ENABLE_CAPINSTA_PROJECT_HANDOFF: "true"
      ENABLE_SERVER_BACKED_EDITOR_MEDIA: "true"
      ENABLE_CLIPPING_PREVIEW_API: "true"
      ENABLE_CLIPPING_EXPORT_API: "true"
      ENABLE_VIRAL_CANDIDATE_ANALYSIS: "true"
      ENABLE_SMART_REFRAME: "true"
      ENABLE_CLIPPING_RUST_RUNTIME: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    cpus: 1
    mem_limit: 1g
    pids_limit: 256

  worker-media:
    <<: *worker
    environment:
      <<: *backend-env
      ENABLE_DURABLE_PROCESSING_WORKER: "true"
      PROCESSING_WORKER_ID: production-media
      PROCESSING_WORKER_MAX_CONCURRENCY: "1"
      ENABLE_MEDIA_PROBE_HANDLER: "true"
      ENABLE_MEDIA_VARIANT_HANDLERS: "true"
      MEDIA_VARIANT_JOB_TYPES: proxy_generation,audio_extraction,thumbnail_generation,waveform_generation

  worker-ai:
    <<: *worker
    environment:
      <<: *backend-env
      ENABLE_DURABLE_PROCESSING_WORKER: "true"
      PROCESSING_WORKER_ID: production-ai
      PROCESSING_WORKER_MAX_CONCURRENCY: "1"
      ENABLE_DURABLE_TRANSCRIPTION_HANDLER: "true"
      ENABLE_TRANSCRIPT_ANALYSIS_HANDLERS: "true"
      ENABLE_TRANSCRIPT_ANALYSIS_PLANNING: "true"
      ENABLE_VIRAL_CANDIDATE_ANALYSIS: "true"
      ENABLE_SMART_REFRAME: "true"
      ENABLE_CLIPPING_RUST_RUNTIME: "true"

  worker-runtime:
    <<: *worker
    environment:
      <<: *backend-env
      ENABLE_DURABLE_PROCESSING_WORKER: "true"
      PROCESSING_WORKER_ID: production-runtime
      PROCESSING_WORKER_MAX_CONCURRENCY: "1"
      ENABLE_CLIPPING_RUST_RUNTIME: "true"
      ENABLE_PROJECT_DERIVATION_HANDLER: "true"
      ENABLE_PROJECT_CONVERSION_HANDLER: "true"

  worker-export:
    <<: *worker
    environment:
      <<: *backend-env
      ENABLE_DURABLE_PROCESSING_WORKER: "true"
      PROCESSING_WORKER_ID: production-export
      PROCESSING_WORKER_MAX_CONCURRENCY: "1"
      ENABLE_CLIPPING_EXPORT_HANDLER: "true"
      ENABLE_CLIPPING_RUST_RUNTIME: "true"

  worker-maintenance:
    <<: *backend-image
    command:
      - sh
      - -c
      - >-
        while true; do
          python -m server.production.cleanup --batch-size 500 &&
          python -m server.production.account_deletion --batch-size 10;
          sleep 3600;
        done
    expose: []
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  clipper-workspaces:
  model-cache:
