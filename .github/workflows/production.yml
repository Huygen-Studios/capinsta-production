name: Production candidate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing staging or production secrets
        type: choice
        options: [staging, production]
        default: staging
      deploy:
        description: Apply migrations and trigger the Coolify deployment
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: capinsta-${{ inputs.environment || github.event_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/huygen-studios/capinsta-production-web
  BACKEND_IMAGE: ghcr.io/huygen-studios/capinsta-production-backend
  PYTHONPATH: backend

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: capinsta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capinsta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-stable-ts.txt
          python -m pip install pytest==9.1.0
          (cd apps/web && bun x playwright install --with-deps chromium)
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Focused verification
        env:
          CORS_ORIGINS: https://capinsta.huygenstudios.com
          FRONTEND_URL: https://capinsta.huygenstudios.com
        run: |
          python -m compileall -q backend
          python -m pytest -q backend/tests
          (cd apps/web && bun x tsc --noEmit)
          (cd apps/web && bun run lint)
          (cd apps/web && bun x playwright test -c playwright.admin.config.ts \
            e2e/editor-onboarding.spec.ts e2e/editor-projects-visual.spec.ts)
          bun test apps/web/src/services/automatic-clipper/api.test.ts
          bun test apps/web/src/services/clip-batches/ranges.test.ts
          (cd apps/web && bun test \
            src/services/server-backed-media/access.test.ts \
            src/services/clipping-handoff/import.test.ts \
            src/app/api/capinsta/[...path]/route.test.ts \
            src/capinsta/originalAdapter.test.tsx \
            src/capinsta/clipProjectConversion.test.ts)
          cargo fmt --all -- --check
          cargo test --workspace --no-fail-fast
          git diff --check
      - name: PostgreSQL 17 R2 migration verification
        env:
          CLIPPING_PERSISTENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/capinsta_test
        run: |
          python -m pytest -q backend/tests/test_clipping_storage_postgres.py -k r2
          python -m pytest -q backend/tests/test_automatic_clipper_postgres.py -k same_media
          python -m pytest -q backend/tests/test_clip_batches_postgres.py
      - name: Editor-first manual Clipper browser E2E
        env:
          CLIPPING_PERSISTENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/capinsta_test
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/capinsta_test
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/capinsta_test
          NODE_ENV: development
          ENABLE_LOCAL_DEVELOPMENT_ACCESS: "true"
          CAPINSTA_UI_TEST_AUTH: "true"
          UI_VERIFICATION: "true"
          NEXT_PUBLIC_CAPINSTA_E2E: "true"
          BACKEND_INTERNAL_URL: http://127.0.0.1:8000
          TRUSTED_PROXY_MODE: none
          CORS_ORIGINS: http://127.0.0.1:3000
          FRONTEND_URL: http://127.0.0.1:3000
          CAPINSTA_BUILD_SHA: ${{ github.sha }}
          CLIPPING_STORAGE_PROVIDER: local
          ENABLE_LOCAL_MEDIA_STORAGE: "true"
          CLIPPING_LOCAL_STORAGE_ROOT: /tmp/capinsta-manual-e2e/storage
          MEDIA_UPLOAD_PROTOCOL: tus
          ENABLE_CLIPPING_PROJECT_API: "true"
          ENABLE_PROJECT_DERIVATION_REQUESTS: "true"
          ENABLE_PROJECT_CONVERSION_REQUESTS: "true"
          ENABLE_CAPINSTA_PROJECT_HANDOFF: "true"
          ENABLE_SERVER_BACKED_EDITOR_MEDIA: "true"
          ENABLE_MEDIA_PROBE_HANDLER: "true"
          MEDIA_PROBE_STORAGE_BACKEND: local
          ENABLE_MEDIA_VARIANT_HANDLERS: "true"
          MEDIA_VARIANT_STORAGE_BACKEND: local
          MEDIA_VARIANT_LOCAL_STORAGE_ROOT: /tmp/capinsta-manual-e2e/storage
          MEDIA_VARIANT_TEMP_ROOT: /tmp/capinsta-manual-e2e/media-variants
          ENABLE_CLIPPING_RUST_RUNTIME: "true"
          ENABLE_PROJECT_DERIVATION_HANDLER: "true"
          ENABLE_PROJECT_CONVERSION_HANDLER: "true"
          CLIPPING_RUNTIME_BINARY: ${{ github.workspace }}/target/debug/capinsta-clipping-runtime
          ENABLE_CLIPPING_PREVIEW_API: "true"
          ENABLE_CLIPPING_EXPORT_API: "true"
          ENABLE_CLIPPING_EXPORT_HANDLER: "true"
          CLIPPING_EXPORT_STORAGE_BACKEND: local
          CLIPPING_EXPORT_LOCAL_STORAGE_ROOT: /tmp/capinsta-manual-e2e/storage
          CLIPPING_EXPORT_TEMP_ROOT: /tmp/capinsta-manual-e2e/exports
          RENDER_PAGE_URL: http://127.0.0.1:3000/render
          CAPINSTA_RENDER_TOKEN_SECRET: local-manual-clipper-render-secret-32
          PROCESSING_WORKER_POLL_SECONDS: "0.1"
          PROCESSING_WORKER_MAX_CONCURRENCY: "2"
          CAPINSTA_E2E_TRANSCRIPTION: "true"
          STT_PROVIDER: gemini
          GEMINI_API_KEY: ci-local-deterministic-provider-key
          CAPTION_QUEUE_MODE: local
          TEMP_DIR: /tmp/capinsta-manual-e2e/legacy/tmp
          UPLOAD_DIR: /tmp/capinsta-manual-e2e/legacy/uploads
          MEDIA_DIR: /tmp/capinsta-manual-e2e/legacy/media
          EXPORT_DIR: /tmp/capinsta-manual-e2e/legacy/exports
          CACHE_DIR: /tmp/capinsta-manual-e2e/legacy/cache
          DB_PATH: /tmp/capinsta-manual-e2e/legacy/database.sqlite
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/backend:$PWD/backend/tests"
          rm -rf /tmp/capinsta-manual-e2e
          mkdir -p "$TEMP_DIR" "$UPLOAD_DIR" "$MEDIA_DIR" "$EXPORT_DIR" "$CACHE_DIR"
          python backend/tests/manual_clipper_e2e_setup.py
          cargo build -p clipping-runtime
          python -m uvicorn server.main:app --host 127.0.0.1 --port 8000 >/tmp/capinsta-manual-api.log 2>&1 &
          api_pid=$!
          python -m server.clipping_jobs.worker >/tmp/capinsta-manual-worker.log 2>&1 &
          worker_pid=$!
          cleanup() {
            status=$?
            kill "$api_pid" "$worker_pid" >/dev/null 2>&1 || true
            if [ "$status" -ne 0 ]; then
              tail -n 300 /tmp/capinsta-manual-api.log || true
              tail -n 300 /tmp/capinsta-manual-worker.log || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health/ready >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health/ready >/dev/null
          (cd apps/web && CAPINSTA_FULL_CLIPPER_E2E=true bun x playwright test \
            -c playwright.admin.config.ts e2e/manual-clipper-full.spec.ts)
      - name: Secret scan
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:latest
          detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner
      - name: Validate production Compose
        env:
          APPLICATION_URL: https://staging.example.com
          CAPINSTA_IMAGE_TAG: ${{ github.sha }}
          CORS_ORIGINS: https://staging.example.com
          DATABASE_URL: postgresql://user:password@db.example.com:5432/postgres
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: example-anon
          SUPABASE_SERVICE_ROLE_KEY: example-service-role
          UPSTASH_REDIS_REST_URL: https://example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: example-token
          ADMIN_SECURITY_PEPPER: 00000000000000000000000000000000
          INTERNAL_ADMIN_API_SECRET: 00000000000000000000000000000000
          INTERNAL_MAINTENANCE_SECRET: 00000000000000000000000000000000
          CAPINSTA_RENDER_TOKEN_SECRET: 00000000000000000000000000000000
          MARBLE_WORKSPACE_KEY: example
          PRIVATE_BETA_ALLOWLIST: owner@example.com
          R2_ACCOUNT_ID: example-account
          R2_ENDPOINT: https://example-account.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: example-access-key
          R2_SECRET_ACCESS_KEY: example-secret-key
        run: docker compose -f docker-compose.production.yml config --quiet

  images:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    strategy:
      matrix:
        include:
          - name: web
            image: ghcr.io/huygen-studios/capinsta-production-web
            dockerfile: apps/web/Dockerfile
          - name: backend
            image: ghcr.io/huygen-studios/capinsta-production-backend
            dockerfile: backend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require public web build variables
        if: matrix.name == 'web' && github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
        env:
          SITE_URL: ${{ vars.APPLICATION_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: test -n "$SITE_URL" -a -n "$SUPABASE_URL" -a -n "$SUPABASE_ANON_KEY"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:production-candidate
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.APPLICATION_URL || 'https://staging.example.invalid' }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://example.supabase.co' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY || 'example-anon' }}
            NEXT_PUBLIC_CAPINSTA_API_BASE_URL=/api/capinsta
            NEXT_PUBLIC_ENABLE_CAPINSTA_PROJECT_HANDOFF=true
            NEXT_PUBLIC_ENABLE_SERVER_BACKED_EDITOR_MEDIA=true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  smoke:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image smoke
        run: |
          docker run --rm "$BACKEND_IMAGE:${GITHUB_SHA}" \
            sh -c "ffmpeg -version >/dev/null && ffprobe -version >/dev/null && printf '%s' '{\"protocolVersion\":1,\"requestId\":\"ci\",\"operation\":\"health\",\"payload\":{},\"options\":{}}' | capinsta-clipping-runtime | grep -q '\"ok\":true'"
      - name: Legacy caption storage smoke
        run: |
          docker volume create capinsta-caption-smoke
          trap 'docker rm -f capinsta-backend-caption-smoke >/dev/null 2>&1 || true; docker volume rm capinsta-caption-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name capinsta-backend-caption-smoke \
            -v capinsta-caption-smoke:/app/storage \
            -e NODE_ENV=development \
            -e ENABLE_LOCAL_DEVELOPMENT_ACCESS=true \
            -e CLIPPING_STORAGE_PROVIDER=local \
            -e ENABLE_LOCAL_MEDIA_STORAGE=true \
            -e CLIPPING_LOCAL_STORAGE_ROOT=/app/storage/clipper-local \
            -e TEMP_DIR=/app/storage/legacy-caption/tmp \
            -e UPLOAD_DIR=/app/storage/legacy-caption/uploads \
            -e MEDIA_DIR=/app/storage/legacy-caption/media \
            -e EXPORT_DIR=/app/storage/legacy-caption/exports \
            -e CACHE_DIR=/app/storage/legacy-caption/cache \
            -e DB_PATH=/app/storage/database.sqlite \
            "$BACKEND_IMAGE:${GITHUB_SHA}"
          for attempt in $(seq 1 45); do
            docker exec capinsta-backend-caption-smoke curl -fsS http://127.0.0.1:10000/health/ready >/dev/null && break
            sleep 2
          done
          docker exec capinsta-backend-caption-smoke ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc=duration=1:size=16x16:rate=1 -pix_fmt yuv420p /tmp/smoke.mp4
          docker exec capinsta-backend-caption-smoke curl -fsS \
            -F project_id=project_smoke \
            -F 'file=@/tmp/smoke.mp4;type=video/mp4' \
            http://127.0.0.1:10000/api/media/assets \
            -o /tmp/media-asset.json
          docker exec capinsta-backend-caption-smoke sh -lc \
            'test -s /app/storage/database.sqlite && find /app/storage/legacy-caption/media -type f | grep -q .'
          docker restart capinsta-backend-caption-smoke >/dev/null
          for attempt in $(seq 1 45); do
            docker exec capinsta-backend-caption-smoke curl -fsS http://127.0.0.1:10000/health/ready >/dev/null && break
            sleep 2
          done
          docker exec capinsta-backend-caption-smoke sh -lc \
            'test -s /app/storage/database.sqlite && find /app/storage/legacy-caption/media -type f | grep -q .'
      - name: Web image smoke
        env:
          DATABASE_URL: postgresql://user:password@db.example.com:5432/postgres
        run: |
          docker run -d --name capinsta-web-smoke -p 3000:3000 \
            -e DATABASE_URL \
            -e UPSTASH_REDIS_REST_URL=https://example.upstash.io \
            -e UPSTASH_REDIS_REST_TOKEN=example-token \
            -e NEXT_PUBLIC_SITE_URL=https://staging.example.com \
            -e NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=example-anon \
            -e NEXT_PUBLIC_MARBLE_API_URL=https://api.marblecms.com \
            -e SUPABASE_SERVICE_ROLE_KEY=00000000000000000000 \
            -e ADMIN_SECURITY_PEPPER=00000000000000000000000000000000 \
            -e INTERNAL_ADMIN_API_SECRET=00000000000000000000000000000000 \
            -e INTERNAL_MAINTENANCE_SECRET=00000000000000000000000000000000 \
            -e BACKEND_INTERNAL_URL=http://127.0.0.1:10000 \
            -e MARBLE_WORKSPACE_KEY=example \
            "$WEB_IMAGE:${GITHUB_SHA}"
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          docker logs capinsta-web-smoke
          exit 1
      - name: Scan browser output and image history
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          container=$(docker create "$WEB_IMAGE:${GITHUB_SHA}")
          docker cp "$container:/app/apps/web/.next/static" /tmp/capinsta-browser-static
          docker rm "$container"
          for name in SUPABASE_SERVICE_ROLE_KEY WHOP_API_KEY GEMINI_API_KEY SARVAM_API_KEY GROQ_API_KEY OPENAI_API_KEY; do
            value="${!name}"
            if [ -n "$value" ] && grep -R -F -q "$value" /tmp/capinsta-browser-static; then
              echo "$name leaked into browser output"
              exit 1
            fi
          done
          ! docker history --no-trunc "$WEB_IMAGE:${GITHUB_SHA}" | grep -E 'SUPABASE_SERVICE_ROLE_KEY=|WHOP_API_KEY=|GEMINI_API_KEY=|SARVAM_API_KEY=|GROQ_API_KEY=|OPENAI_API_KEY='
          ! docker history --no-trunc "$BACKEND_IMAGE:${GITHUB_SHA}" | grep -E 'SUPABASE_SERVICE_ROLE_KEY=|WHOP_API_KEY=|GEMINI_API_KEY=|SARVAM_API_KEY=|GROQ_API_KEY=|OPENAI_API_KEY='

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: smoke
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply additive migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CAPINSTA_MIGRATION_BASELINE: ${{ vars.CAPINSTA_MIGRATION_BASELINE }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$CAPINSTA_MIGRATION_BASELINE"
          docker run --rm \
            -e DATABASE_URL \
            -e CAPINSTA_MIGRATION_BASELINE \
            "$BACKEND_IMAGE:${GITHUB_SHA}" \
            python -m server.production.migrate
      - name: Trigger Coolify
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          test -n "$COOLIFY_DEPLOY_WEBHOOK"
          curl --fail --silent --show-error --request POST "$COOLIFY_DEPLOY_WEBHOOK"
      - name: Verify deployed health
        env:
          APPLICATION_URL: ${{ vars.APPLICATION_URL }}
        run: |
          test -n "$APPLICATION_URL"
          for attempt in $(seq 1 60); do
            curl -fsS "$APPLICATION_URL/api/health" && \
            curl -fsS "$APPLICATION_URL/api/capinsta/health/ready" && exit 0
            sleep 10
          done
          exit 1
      - name: Promote successful images
        run: |
          for image in "$WEB_IMAGE" "$BACKEND_IMAGE"; do
            docker pull "$image:${GITHUB_SHA}"
            docker tag "$image:${GITHUB_SHA}" "$image:latest"
            docker push "$image:latest"
          done
