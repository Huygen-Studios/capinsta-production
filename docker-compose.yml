services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencut
      POSTGRES_PASSWORD: opencut
      POSTGRES_DB: opencut
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencut"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: example_token
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  backend:
    image: capinsta-production-editor-backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    expose:
      - "10000"
    environment:
      - NODE_ENV=production
      - PORT=10000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3100}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3100}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - ADMIN_DATABASE_URL=${ADMIN_DATABASE_URL:-postgresql://opencut:opencut@db:5432/opencut}
      - DATABASE_URL=${DATABASE_URL:-postgresql://opencut:opencut@db:5432/opencut}
      - ENABLE_SUPABASE_DURABLE_JOBS=${ENABLE_SUPABASE_DURABLE_JOBS:-false}
      - ENABLE_SUPABASE_MEDIA_STORAGE=${ENABLE_SUPABASE_MEDIA_STORAGE:-false}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_SOURCE_MEDIA_BUCKET=${SUPABASE_SOURCE_MEDIA_BUCKET:-source-media}
      - SUPABASE_MEDIA_VARIANTS_BUCKET=${SUPABASE_MEDIA_VARIANTS_BUCKET:-media-variants}
      - SUPABASE_MEDIA_EXPORTS_BUCKET=${SUPABASE_MEDIA_EXPORTS_BUCKET:-media-exports}
      - MEDIA_UPLOAD_PROTOCOL=${MEDIA_UPLOAD_PROTOCOL:-tus}
      - MEDIA_UPLOAD_MAX_BYTES=${MEDIA_UPLOAD_MAX_BYTES:-2147483648}
      - MAX_SOURCE_FILE_BYTES=${MAX_SOURCE_FILE_BYTES:-2147483648}
      - MAX_ACTIVE_UPLOADS_PER_USER=${MAX_ACTIVE_UPLOADS_PER_USER:-2}
      - MEDIA_PREVIEW_URL_TTL_SECONDS=${MEDIA_PREVIEW_URL_TTL_SECONDS:-900}
      - MEDIA_DOWNLOAD_URL_TTL_SECONDS=${MEDIA_DOWNLOAD_URL_TTL_SECONDS:-300}
      - MEDIA_SIGNED_URL_MAX_TTL_SECONDS=${MEDIA_SIGNED_URL_MAX_TTL_SECONDS:-3600}
      - MEDIA_UPLOAD_SESSION_TTL_SECONDS=${MEDIA_UPLOAD_SESSION_TTL_SECONDS:-7200}
      - ENABLE_CAPINSTA_PROJECT_HANDOFF=${ENABLE_CAPINSTA_PROJECT_HANDOFF:-false}
      - ENABLE_SERVER_BACKED_EDITOR_MEDIA=${ENABLE_SERVER_BACKED_EDITOR_MEDIA:-false}
      - CLIPPING_HANDOFF_TTL_SECONDS=${CLIPPING_HANDOFF_TTL_SECONDS:-900}
      - CLIPPING_HANDOFF_MAX_TTL_SECONDS=${CLIPPING_HANDOFF_MAX_TTL_SECONDS:-3600}
      - CLIPPING_HANDOFF_MAX_MANIFEST_BYTES=${CLIPPING_HANDOFF_MAX_MANIFEST_BYTES:-67108864}
      - TEMP_DIR=/app/storage/tmp
      - MEDIA_DIR=/app/storage/media
      - UPLOAD_DIR=/app/storage/uploads
      - EXPORT_DIR=/app/storage/exports
      - CACHE_DIR=/app/storage/cache
      - DB_PATH=/app/storage/database.sqlite
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-500}
      - CAPTION_DURATION_LIMIT_SECONDS=${CAPTION_DURATION_LIMIT_SECONDS:-180}
      - MAX_MEDIA_DURATION_SECONDS=${MAX_MEDIA_DURATION_SECONDS:-5400}
      - MAX_MEDIA_LONG_EDGE=${MAX_MEDIA_LONG_EDGE:-4096}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CAPINSTA_RENDER_BASE_URL=${CAPINSTA_RENDER_BASE_URL:-http://web:3000}
      - RENDER_PAGE_URL=${RENDER_PAGE_URL:-http://web:3000/render}
      - CAPINSTA_RENDER_TOKEN_SECRET=${CAPINSTA_RENDER_TOKEN_SECRET}
      - ENABLE_CLIPPER_UI=${ENABLE_CLIPPER_UI:-false}
      - ENABLE_WHOP_ACCESS=${ENABLE_WHOP_ACCESS:-false}
      - WHOP_WEBHOOK_SECRET=${WHOP_WEBHOOK_SECRET:-}
      - WHOP_PRODUCT_ID=${WHOP_PRODUCT_ID:-}
      - ENABLE_USAGE_QUOTAS=${ENABLE_USAGE_QUOTAS:-false}
      - ENABLE_RETENTION_CLEANUP=${ENABLE_RETENTION_CLEANUP:-false}
      - ENABLE_ACCOUNT_DELETION=${ENABLE_ACCOUNT_DELETION:-false}
      - PRIVATE_BETA_MAX_SOURCE_FILE_BYTES=${PRIVATE_BETA_MAX_SOURCE_FILE_BYTES:-2147483648}
      - PRIVATE_BETA_MAX_SOURCE_DURATION_SECONDS=${PRIVATE_BETA_MAX_SOURCE_DURATION_SECONDS:-5400}
      - PRIVATE_BETA_MAX_ACTIVE_PROCESSING_JOBS=${PRIVATE_BETA_MAX_ACTIVE_PROCESSING_JOBS:-2}
      - PRIVATE_BETA_PROCESSING_MINUTES=${PRIVATE_BETA_PROCESSING_MINUTES:-180}
      - PRIVATE_BETA_MAX_STORED_SOURCE_BYTES=${PRIVATE_BETA_MAX_STORED_SOURCE_BYTES:-10737418240}
      - PRIVATE_BETA_MAX_CONCURRENT_EXPORTS=${PRIVATE_BETA_MAX_CONCURRENT_EXPORTS:-1}
      - PRIVATE_BETA_MAX_STORED_EXPORT_BYTES=${PRIVATE_BETA_MAX_STORED_EXPORT_BYTES:-10737418240}
      - DISABLE_NEW_UPLOADS=${DISABLE_NEW_UPLOADS:-true}
      - DISABLE_CANDIDATE_ANALYSIS=${DISABLE_CANDIDATE_ANALYSIS:-true}
      - DISABLE_CLIPPING_EXPORTS=${DISABLE_CLIPPING_EXPORTS:-true}
    volumes:
      - backend_runtime:/app/storage
      - backend_model_cache:/data/capinsta/model-cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10000/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  clipping-worker:
    profiles: ["durable-worker"]
    image: capinsta-production-editor-backend
    restart: unless-stopped
    command: ["python", "-m", "server.clipping_jobs.worker"]
    environment:
      - ADMIN_DATABASE_URL=${ADMIN_DATABASE_URL:-postgresql://opencut:opencut@db:5432/opencut}
      - DATABASE_URL=${DATABASE_URL:-postgresql://opencut:opencut@db:5432/opencut}
      - ENABLE_DURABLE_PROCESSING_WORKER=${ENABLE_DURABLE_PROCESSING_WORKER:-true}
      - PROCESSING_WORKER_ID=${PROCESSING_WORKER_ID:-}
      - PROCESSING_WORKER_POLL_SECONDS=${PROCESSING_WORKER_POLL_SECONDS:-2}
      - PROCESSING_WORKER_MAX_CONCURRENCY=${PROCESSING_WORKER_MAX_CONCURRENCY:-1}
      - PROCESSING_WORKER_SHUTDOWN_GRACE_SECONDS=${PROCESSING_WORKER_SHUTDOWN_GRACE_SECONDS:-30}
      - PROCESSING_JOB_LEASE_SECONDS=${PROCESSING_JOB_LEASE_SECONDS:-90}
      - PROCESSING_JOB_HEARTBEAT_SECONDS=${PROCESSING_JOB_HEARTBEAT_SECONDS:-30}
      - PROCESSING_JOB_RETRY_BASE_SECONDS=${PROCESSING_JOB_RETRY_BASE_SECONDS:-10}
      - PROCESSING_JOB_RETRY_MULTIPLIER=${PROCESSING_JOB_RETRY_MULTIPLIER:-2}
      - PROCESSING_JOB_RETRY_MAX_SECONDS=${PROCESSING_JOB_RETRY_MAX_SECONDS:-900}
      - PROCESSING_JOB_RETRY_JITTER_PERCENT=${PROCESSING_JOB_RETRY_JITTER_PERCENT:-20}
      - PROCESSING_JOB_RECOVERY_INTERVAL_SECONDS=${PROCESSING_JOB_RECOVERY_INTERVAL_SECONDS:-30}
      - PROCESSING_JOB_RECOVERY_BATCH_SIZE=${PROCESSING_JOB_RECOVERY_BATCH_SIZE:-100}
      - ENABLE_MEDIA_PROBE_HANDLER=${ENABLE_MEDIA_PROBE_HANDLER:-false}
      - ENABLE_MEDIA_VARIANT_PLANNING=${ENABLE_MEDIA_VARIANT_PLANNING:-false}
      - ENABLE_MEDIA_VARIANT_HANDLERS=${ENABLE_MEDIA_VARIANT_HANDLERS:-false}
      - MEDIA_VARIANT_JOB_TYPES=${MEDIA_VARIANT_JOB_TYPES:-proxy_generation,audio_extraction,thumbnail_generation,waveform_generation}
      - FFMPEG_BINARY=${FFMPEG_BINARY:-ffmpeg}
      - FFPROBE_BINARY=${FFPROBE_BINARY:-ffprobe}
      - MEDIA_PROBE_TIMEOUT_SECONDS=${MEDIA_PROBE_TIMEOUT_SECONDS:-45}
      - MEDIA_PROBE_TERMINATE_GRACE_SECONDS=${MEDIA_PROBE_TERMINATE_GRACE_SECONDS:-3}
      - MEDIA_PROBE_SIGNED_URL_TTL_SECONDS=${MEDIA_PROBE_SIGNED_URL_TTL_SECONDS:-120}
      - MEDIA_PROBE_SIGNED_URL_SAFETY_SECONDS=${MEDIA_PROBE_SIGNED_URL_SAFETY_SECONDS:-10}
      - MEDIA_PROBE_MAX_STDOUT_BYTES=${MEDIA_PROBE_MAX_STDOUT_BYTES:-1048576}
      - MEDIA_PROBE_MAX_STDERR_BYTES=${MEDIA_PROBE_MAX_STDERR_BYTES:-65536}
      - MEDIA_PROBE_PROBE_SIZE_BYTES=${MEDIA_PROBE_PROBE_SIZE_BYTES:-5000000}
      - MEDIA_PROBE_ANALYZE_DURATION_MICROSECONDS=${MEDIA_PROBE_ANALYZE_DURATION_MICROSECONDS:-5000000}
      - MEDIA_PROBE_MAX_DURATION_MS=${MEDIA_PROBE_MAX_DURATION_MS:-86400000}
      - MEDIA_PROBE_MAX_FPS=${MEDIA_PROBE_MAX_FPS:-240}
      - MEDIA_PROBE_STORAGE_BACKEND=${MEDIA_PROBE_STORAGE_BACKEND:-supabase}
      - MEDIA_VARIANT_TEMP_ROOT=${MEDIA_VARIANT_TEMP_ROOT:-/app/storage/media-variants-tmp}
      - MEDIA_VARIANT_MAX_TEMP_BYTES=${MEDIA_VARIANT_MAX_TEMP_BYTES:-2147483648}
      - MEDIA_VARIANT_MAX_STDERR_BYTES=${MEDIA_VARIANT_MAX_STDERR_BYTES:-65536}
      - MEDIA_VARIANT_MAX_PROGRESS_BYTES=${MEDIA_VARIANT_MAX_PROGRESS_BYTES:-262144}
      - MEDIA_VARIANT_TERMINATE_GRACE_SECONDS=${MEDIA_VARIANT_TERMINATE_GRACE_SECONDS:-3}
      - MEDIA_VARIANT_SIGNED_URL_TTL_SECONDS=${MEDIA_VARIANT_SIGNED_URL_TTL_SECONDS:-3600}
      - MEDIA_VARIANT_SIGNED_URL_SAFETY_SECONDS=${MEDIA_VARIANT_SIGNED_URL_SAFETY_SECONDS:-30}
      - PROXY_TIMEOUT_SECONDS=${PROXY_TIMEOUT_SECONDS:-1800}
      - PROXY_MAX_OUTPUT_BYTES=${PROXY_MAX_OUTPUT_BYTES:-1073741824}
      - AUDIO_EXTRACTION_TIMEOUT_SECONDS=${AUDIO_EXTRACTION_TIMEOUT_SECONDS:-1800}
      - AUDIO_EXTRACTION_MAX_OUTPUT_BYTES=${AUDIO_EXTRACTION_MAX_OUTPUT_BYTES:-1073741824}
      - THUMBNAIL_TIMEOUT_SECONDS=${THUMBNAIL_TIMEOUT_SECONDS:-120}
      - THUMBNAIL_MAX_OUTPUT_BYTES=${THUMBNAIL_MAX_OUTPUT_BYTES:-20971520}
      - WAVEFORM_TIMEOUT_SECONDS=${WAVEFORM_TIMEOUT_SECONDS:-1800}
      - WAVEFORM_MAX_OUTPUT_BYTES=${WAVEFORM_MAX_OUTPUT_BYTES:-20971520}
      - WAVEFORM_BUCKET_DURATION_MS=${WAVEFORM_BUCKET_DURATION_MS:-10}
      - WAVEFORM_MAX_PEAKS=${WAVEFORM_MAX_PEAKS:-200000}
      - MEDIA_VARIANT_DURATION_TOLERANCE_MS=${MEDIA_VARIANT_DURATION_TOLERANCE_MS:-1000}
      - MEDIA_VARIANT_STORAGE_BACKEND=${MEDIA_VARIANT_STORAGE_BACKEND:-supabase}
      - ENABLE_DURABLE_TRANSCRIPTION_HANDLER=${ENABLE_DURABLE_TRANSCRIPTION_HANDLER:-false}
      - TRANSCRIPTION_STORAGE_BACKEND=${TRANSCRIPTION_STORAGE_BACKEND:-supabase}
      - TRANSCRIPTION_TEMP_ROOT=${TRANSCRIPTION_TEMP_ROOT:-/app/storage/transcription-tmp}
      - TRANSCRIPTION_HANDLER_TIMEOUT_SECONDS=${TRANSCRIPTION_HANDLER_TIMEOUT_SECONDS:-3600}
      - TRANSCRIPTION_PROVIDER_TIMEOUT_SECONDS=${TRANSCRIPTION_PROVIDER_TIMEOUT_SECONDS:-120}
      - TRANSCRIPTION_SOURCE_URL_TTL_SECONDS=${TRANSCRIPTION_SOURCE_URL_TTL_SECONDS:-300}
      - TRANSCRIPTION_SOURCE_DOWNLOAD_TIMEOUT_SECONDS=${TRANSCRIPTION_SOURCE_DOWNLOAD_TIMEOUT_SECONDS:-120}
      - TRANSCRIPTION_MAX_SOURCE_BYTES=${TRANSCRIPTION_MAX_SOURCE_BYTES:-2000000000}
      - TRANSCRIPTION_MAX_PROVIDER_RESPONSE_BYTES=${TRANSCRIPTION_MAX_PROVIDER_RESPONSE_BYTES:-64000000}
      - TRANSCRIPTION_MAX_HOTWORDS=${TRANSCRIPTION_MAX_HOTWORDS:-50}
      - TRANSCRIPTION_MAX_HOTWORD_LENGTH=${TRANSCRIPTION_MAX_HOTWORD_LENGTH:-100}
      - STT_PROVIDER=${STT_PROVIDER:-auto}
      - STT_PROVIDER_ORDER=${STT_PROVIDER_ORDER:-gemini,sarvam,groq_whisper,openai_whisper}
      - STT_PROVIDER_ATTEMPT_TIMEOUT_SECONDS=${STT_PROVIDER_ATTEMPT_TIMEOUT_SECONDS:-60}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENABLE_SUPABASE_MEDIA_STORAGE=${ENABLE_SUPABASE_MEDIA_STORAGE:-false}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_SOURCE_MEDIA_BUCKET=${SUPABASE_SOURCE_MEDIA_BUCKET:-source-media}
      - SUPABASE_MEDIA_VARIANTS_BUCKET=${SUPABASE_MEDIA_VARIANTS_BUCKET:-media-variants}
      - SUPABASE_MEDIA_EXPORTS_BUCKET=${SUPABASE_MEDIA_EXPORTS_BUCKET:-media-exports}
      - MEDIA_SIGNED_URL_MAX_TTL_SECONDS=${MEDIA_SIGNED_URL_MAX_TTL_SECONDS:-3600}
      - ENABLE_CLIPPING_RUST_RUNTIME=${ENABLE_CLIPPING_RUST_RUNTIME:-false}
      - CLIPPING_RUNTIME_BINARY=${CLIPPING_RUNTIME_BINARY:-/usr/local/bin/capinsta-clipping-runtime}
      - CLIPPING_RUNTIME_PROTOCOL_VERSION=${CLIPPING_RUNTIME_PROTOCOL_VERSION:-1}
      - CLIPPING_RUNTIME_TIMEOUT_SECONDS=${CLIPPING_RUNTIME_TIMEOUT_SECONDS:-120}
      - CLIPPING_RUNTIME_MAX_STDIN_BYTES=${CLIPPING_RUNTIME_MAX_STDIN_BYTES:-67108864}
      - CLIPPING_RUNTIME_MAX_STDOUT_BYTES=${CLIPPING_RUNTIME_MAX_STDOUT_BYTES:-134217728}
      - CLIPPING_RUNTIME_MAX_STDERR_BYTES=${CLIPPING_RUNTIME_MAX_STDERR_BYTES:-65536}
      - CLIPPING_RUNTIME_TERMINATE_GRACE_SECONDS=${CLIPPING_RUNTIME_TERMINATE_GRACE_SECONDS:-3}
      - ENABLE_PROJECT_DERIVATION_HANDLER=${ENABLE_PROJECT_DERIVATION_HANDLER:-false}
      - ENABLE_PROJECT_CONVERSION_HANDLER=${ENABLE_PROJECT_CONVERSION_HANDLER:-false}
      - PROJECT_DERIVATION_TIMEOUT_SECONDS=${PROJECT_DERIVATION_TIMEOUT_SECONDS:-120}
      - PROJECT_CONVERSION_TIMEOUT_SECONDS=${PROJECT_CONVERSION_TIMEOUT_SECONDS:-120}
      - ENABLE_VIRAL_CANDIDATE_ANALYSIS=${ENABLE_VIRAL_CANDIDATE_ANALYSIS:-false}
      - ENABLE_SMART_REFRAME=${ENABLE_SMART_REFRAME:-false}
      - VIRAL_CANDIDATE_PROVIDER_TIMEOUT_SECONDS=${VIRAL_CANDIDATE_PROVIDER_TIMEOUT_SECONDS:-90}
      - VIRAL_CANDIDATE_JOB_TIMEOUT_SECONDS=${VIRAL_CANDIDATE_JOB_TIMEOUT_SECONDS:-180}
      - VIRAL_CANDIDATE_MAX_INPUT_CHARS=${VIRAL_CANDIDATE_MAX_INPUT_CHARS:-28000}
      - VIRAL_CANDIDATE_MAX_OUTPUT_BYTES=${VIRAL_CANDIDATE_MAX_OUTPUT_BYTES:-256000}
      - SMART_REFRAME_JOB_TIMEOUT_SECONDS=${SMART_REFRAME_JOB_TIMEOUT_SECONDS:-600}
      - SMART_REFRAME_SAMPLE_FPS=${SMART_REFRAME_SAMPLE_FPS:-2}
      - SMART_REFRAME_MAX_SAMPLE_FRAMES=${SMART_REFRAME_MAX_SAMPLE_FRAMES:-180}
      - AUTOMATIC_CLIPPER_STORAGE_BACKEND=${AUTOMATIC_CLIPPER_STORAGE_BACKEND:-supabase}
      - AUTOMATIC_CLIPPER_TEMP_ROOT=${AUTOMATIC_CLIPPER_TEMP_ROOT:-/app/storage/automatic-clipper-tmp}
      - ENABLE_USAGE_QUOTAS=${ENABLE_USAGE_QUOTAS:-false}
      - ENABLE_RETENTION_CLEANUP=${ENABLE_RETENTION_CLEANUP:-false}
      - ENABLE_ACCOUNT_DELETION=${ENABLE_ACCOUNT_DELETION:-false}
      - PRIVATE_BETA_MAX_SOURCE_FILE_BYTES=${PRIVATE_BETA_MAX_SOURCE_FILE_BYTES:-2147483648}
      - PRIVATE_BETA_MAX_SOURCE_DURATION_SECONDS=${PRIVATE_BETA_MAX_SOURCE_DURATION_SECONDS:-5400}
      - PRIVATE_BETA_MAX_ACTIVE_PROCESSING_JOBS=${PRIVATE_BETA_MAX_ACTIVE_PROCESSING_JOBS:-2}
      - PRIVATE_BETA_PROCESSING_MINUTES=${PRIVATE_BETA_PROCESSING_MINUTES:-180}
      - PRIVATE_BETA_MAX_STORED_SOURCE_BYTES=${PRIVATE_BETA_MAX_STORED_SOURCE_BYTES:-10737418240}
      - PRIVATE_BETA_MAX_CONCURRENT_EXPORTS=${PRIVATE_BETA_MAX_CONCURRENT_EXPORTS:-1}
      - PRIVATE_BETA_MAX_STORED_EXPORT_BYTES=${PRIVATE_BETA_MAX_STORED_EXPORT_BYTES:-10737418240}
      - DISABLE_NEW_UPLOADS=${DISABLE_NEW_UPLOADS:-true}
      - DISABLE_CANDIDATE_ANALYSIS=${DISABLE_CANDIDATE_ANALYSIS:-true}
      - DISABLE_CLIPPING_EXPORTS=${DISABLE_CLIPPING_EXPORTS:-true}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        - FREESOUND_CLIENT_ID=${FREESOUND_CLIENT_ID}
        - FREESOUND_API_KEY=${FREESOUND_API_KEY}
        - NEXT_PUBLIC_MARBLE_API_URL=${NEXT_PUBLIC_MARBLE_API_URL:-https://api.marblecms.com}
        - NEXT_PUBLIC_CAPINSTA_EXPORT_STRATEGY=${NEXT_PUBLIC_CAPINSTA_EXPORT_STRATEGY:-headless}
        - NEXT_PUBLIC_ENABLE_CAPINSTA_PROJECT_HANDOFF=${NEXT_PUBLIC_ENABLE_CAPINSTA_PROJECT_HANDOFF:-false}
        - NEXT_PUBLIC_ENABLE_SERVER_BACKED_EDITOR_MEDIA=${NEXT_PUBLIC_ENABLE_SERVER_BACKED_EDITOR_MEDIA:-false}
        - MARBLE_WORKSPACE_KEY=${MARBLE_WORKSPACE_KEY:-build-placeholder}
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://opencut:opencut@db:5432/opencut
      - UPSTASH_REDIS_REST_URL=http://serverless-redis-http:80
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - UPSTASH_REDIS_REST_TOKEN=example_token
      - BACKEND_INTERNAL_URL=http://backend:10000
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ADMIN_SECURITY_PEPPER=${ADMIN_SECURITY_PEPPER}
      - INTERNAL_ADMIN_API_SECRET=${INTERNAL_ADMIN_API_SECRET}
      - INTERNAL_MAINTENANCE_SECRET=${INTERNAL_MAINTENANCE_SECRET}
      - CAPINSTA_RENDER_TOKEN_SECRET=${CAPINSTA_RENDER_TOKEN_SECRET}
      - NEXT_PUBLIC_SITE_URL=http://localhost:3100
      - NEXT_PUBLIC_MARBLE_API_URL=https://api.marblecms.com
      - NEXT_PUBLIC_CAPINSTA_EXPORT_STRATEGY=headless
      - NEXT_PUBLIC_ENABLE_CAPINSTA_PROJECT_HANDOFF=${NEXT_PUBLIC_ENABLE_CAPINSTA_PROJECT_HANDOFF:-false}
      - NEXT_PUBLIC_ENABLE_SERVER_BACKED_EDITOR_MEDIA=${NEXT_PUBLIC_ENABLE_SERVER_BACKED_EDITOR_MEDIA:-false}
      - ENABLE_CLIPPER_UI=${ENABLE_CLIPPER_UI:-false}
      - ENABLE_WHOP_ACCESS=${ENABLE_WHOP_ACCESS:-false}
      - ENABLE_ACCOUNT_DELETION=${ENABLE_ACCOUNT_DELETION:-false}
      - ACCOUNT_DELETION_RECENT_AUTH_SECONDS=${ACCOUNT_DELETION_RECENT_AUTH_SECONDS:-900}
      - PRIVATE_BETA_MAX_USERS=${PRIVATE_BETA_MAX_USERS:-0}
      - PRIVATE_BETA_ALLOWLIST=${PRIVATE_BETA_ALLOWLIST:-}
      - WHOP_APP_ID=${WHOP_APP_ID:-}
      - WHOP_API_KEY=${WHOP_API_KEY:-}
      - WHOP_PRODUCT_ID=${WHOP_PRODUCT_ID:-}
      - MARBLE_WORKSPACE_KEY=${MARBLE_WORKSPACE_KEY:-placeholder}
      - FREESOUND_CLIENT_ID=${FREESOUND_CLIENT_ID}
      - FREESOUND_API_KEY=${FREESOUND_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      serverless-redis-http:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  backend_runtime:
  backend_model_cache:

networks:
  default:
    name: opencut-network
