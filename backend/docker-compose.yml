services:
  huygen-caps:
    build:
      # The production backend image also builds the Next.js /render artifact,
      # so its Docker build context must be the monorepo root.
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "10000:10000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 10000
      TEMP_DIR: /tmp/huygen-caps
      UPLOAD_DIR: /tmp/huygen-caps/uploads
      EXPORT_DIR: /tmp/huygen-caps/exports
      DB_PATH: /tmp/huygen-caps/database.sqlite
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
